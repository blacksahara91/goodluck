plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ember.bylauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.ember.bylauncher"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "11.0"
    }
    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
